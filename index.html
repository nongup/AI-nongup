<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#356943">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI농장비서">
<link rel="manifest" href="manifest.json">
<title>AI 농장비서</title>
<style>
*{box-sizing:border-box}
:root{
  --green:#2f6b43;
  --green2:#3f8055;
  --deep:#1f4f31;
  --mint:#eef7ef;
  --cream:#fbfaf4;
  --line:#dfe8dc;
  --blue:#426f9f;
  --red:#9b4747;
  --text:#1f2a21;
}
body{
  margin:0;
  background:
    radial-gradient(circle at top right, rgba(93,148,86,.25), transparent 32%),
    linear-gradient(180deg,#f1f6ef 0%,#fbfaf4 45%,#f5f6f3 100%);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
header{
  background:linear-gradient(135deg,var(--deep),var(--green2));
  color:white;
  padding:26px 18px 30px;
  border-bottom-left-radius:28px;
  border-bottom-right-radius:28px;
  box-shadow:0 8px 22px rgba(31,79,49,.24);
}
header h1{
  margin:0;
  font-size:28px;
  letter-spacing:-.7px;
  font-weight:900;
}
header p{
  margin:8px 0 0;
  font-size:15px;
  line-height:1.5;
  opacity:.95;
  font-weight:700;
}
.wrap{
  max-width:880px;
  margin:auto;
  padding:16px 14px 28px;
}
.notice{
  display:none;
}
.menuBtn{
  width:100%;
  border:1px solid rgba(223,232,220,.95);
  border-radius:22px;
  padding:18px 18px;
  margin:11px 0;
  background:
    linear-gradient(135deg,rgba(255,255,255,.98),rgba(240,248,239,.96));
  color:var(--deep);
  font-size:20px;
  font-weight:850;
  text-align:left;
  box-shadow:0 8px 20px rgba(45,91,56,.09);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.menuBtn::before{
  content:"";
  width:42px;
  height:42px;
  flex:0 0 42px;
  border-radius:15px;
  background:linear-gradient(135deg,#dff2df,#b9dfbd);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8);
}
.menuBtn:nth-of-type(1)::before{content:"🏡";display:grid;place-items:center;font-size:23px}
.menuBtn:nth-of-type(2)::before{content:"📝";display:grid;place-items:center;font-size:23px}
.menuBtn:nth-of-type(3)::before{content:"📦";display:grid;place-items:center;font-size:23px}
.menuBtn:nth-of-type(4)::before{content:"👥";display:grid;place-items:center;font-size:23px}
.menuBtn:nth-of-type(5)::before{content:"🤖";display:grid;place-items:center;font-size:23px}
.menuBtn:nth-of-type(6)::before{content:"📊";display:grid;place-items:center;font-size:23px}
.menuBtn:nth-of-type(7)::before{content:"💾";display:grid;place-items:center;font-size:23px}
.menuBtn span{
  margin-left:auto;
  font-size:28px;
  color:var(--green);
  background:transparent;
  padding:0 2px;
  border-radius:999px;
  white-space:nowrap;
  font-weight:900;
}
.panel{
  display:none;
  background:rgba(255,255,255,.96);
  border:1px solid var(--line);
  border-radius:24px;
  padding:18px;
  margin:0 0 16px;
  box-shadow:0 10px 26px rgba(45,91,56,.08);
}
.panel.open{
  display:block;
  animation:openPanel .18s ease-out;
}
@keyframes openPanel{
  from{opacity:.3;transform:translateY(-4px)}
  to{opacity:1;transform:translateY(0)}
}
h2{
  margin:0 0 16px;
  color:var(--deep);
  font-size:20px;
  letter-spacing:-.4px;
}
label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:6px;
  color:#334237;
}
input,select,textarea{
  width:100%;
  padding:14px;
  border:1px solid #d4ded0;
  border-radius:15px;
  font-size:15px;
  margin-bottom:12px;
  background:#fff;
  outline:none;
}
input:focus,select:focus,textarea:focus{
  border-color:#73a579;
  box-shadow:0 0 0 3px rgba(96,150,101,.14);
}
textarea{min-height:88px;resize:vertical}
button{
  width:100%;
  border:0;
  border-radius:16px;
  padding:15px;
  font-size:16px;
  font-weight:850;
  margin-top:8px;
  cursor:pointer;
  letter-spacing:-.2px;
}
.green{
  background:linear-gradient(135deg,var(--green),var(--deep));
  color:white;
  box-shadow:0 7px 16px rgba(47,107,67,.18);
}
.soft{
  background:#eef5ec;
  color:var(--deep);
  border:1px solid #dce8d8;
}
.blue{
  background:linear-gradient(135deg,#4778a8,#315f8e);
  color:white;
  box-shadow:0 7px 16px rgba(66,111,159,.16);
}
.red{background:#9b4747;color:white}
.result{
  background:linear-gradient(180deg,#fbfdf9,#f4f8f1);
  border:1px solid #dce8d8;
  border-radius:18px;
  padding:15px;
  white-space:pre-wrap;
  line-height:1.7;
  margin-top:12px;
  font-size:15px;
  max-height:360px;
  overflow:auto;
}
.record{
  background:linear-gradient(135deg,#eef7ef,#f9fbf7);
  border:1px solid #dce8d8;
  border-radius:17px;
  padding:13px;
  margin-top:10px;
  line-height:1.58;
  font-size:14px;
}
.actionRow{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:10px;
}
.actionRow button{
  font-size:14px;
  padding:10px;
  margin-top:0;
  border-radius:12px;
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-top:12px;
}
.kpi div{
  background:#fff;
  border:1px solid #dce8d8;
  border-radius:17px;
  padding:13px;
  font-size:13px;
}
.kpi strong{
  display:block;
  color:var(--deep);
  font-size:18px;
  margin-top:5px;
}
.quick{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.quick button{
  margin-top:0;
  min-height:52px;
}
@media(max-width:760px){
  .grid2,.kpi,.quick{grid-template-columns:1fr}
  .menuBtn{font-size:18px;padding:16px}
  .menuBtn::before{width:38px;height:38px;flex-basis:38px}
  header{padding-top:24px}
}
</style>
</head>
<body>
<header><h1>AI 농장비서</h1><p>대전농업기술센터</p></header>
<div class="wrap">
<div class="notice"></div>

<button class="menuBtn" onclick="togglePanel('profilePanel')">농장 기본정보 <span>›</span></button>
<div id="profilePanel" class="panel">
<h2>농장 기본정보</h2>
<div class="grid2"><div><label>농장명</label><input id="farmName"></div><div><label>대표자</label><input id="ownerName"></div></div>
<div class="grid2"><div><label>연락처</label><input id="farmPhone"></div><div><label>주작목</label><select id="crop"><option>딸기</option><option>토마토</option><option>고추</option><option>포도</option><option>상추</option><option>기타</option></select></div></div>
<label>특이사항</label><textarea id="memo"></textarea>
<button class="green" onclick="saveProfile()">기본정보 저장</button>
<button class="soft" onclick="loadSample()">예시 데이터 넣기</button>
</div>

<button class="menuBtn" onclick="togglePanel('recordPanel')">오늘 기록하기 <span>›</span></button>
<div id="recordPanel" class="panel">
<h2>오늘 기록하기</h2>
<label>날짜</label><input type="date" id="recordDate">
<label>기록유형</label><select id="recordType"><option>작업일지</option><option>농약·비료</option><option>농자재</option><option>판매</option></select>
<label>내용</label><textarea id="recordContent"></textarea>
<label>금액</label><input type="number" id="recordPrice">
<button class="green" onclick="saveRecord()">기록 저장</button>
<button class="soft" onclick="makeDiarySentence()">영농일지 문장 만들기</button>
<div id="recordList"></div>
</div>

<button class="menuBtn" onclick="togglePanel('reservePanel')">예약·주문 관리 <span>›</span></button>
<div id="reservePanel" class="panel">
<h2>예약·주문 관리</h2>
<input type="hidden" id="editReserveIndex">
<label>구분</label><select id="reserveType"><option>직거래 주문</option><option>택배 주문</option><option>체험 예약</option><option>방문 수령 예약</option><option>기타</option></select>
<label>예약일 / 수령일</label><input type="date" id="reserveDate">
<label>고객명</label><input id="customerName">
<label>연락처</label><input id="customerPhone">
<label>품목 / 체험명</label><input id="reserveItem">
<label>수량 / 인원</label><input id="reserveQty">
<label>금액</label><input type="number" id="reservePrice">
<label>상태</label><select id="reserveStatus"><option>접수</option><option>입금대기</option><option>입금완료</option><option>준비중</option><option>발송완료</option><option>방문예정</option><option>완료</option><option>취소</option></select>
<button class="green" onclick="saveReservation()">예약 저장</button>
<button class="soft" onclick="makeReserveMsg()">예약 안내문자</button>
<div id="reserveList"></div>
</div>

<button class="menuBtn" onclick="togglePanel('customerPanel')">고객관리 <span>›</span></button>
<div id="customerPanel" class="panel">
<h2>고객관리</h2>
<button class="green" onclick="makeCustomerSummary()">고객 요약 보기</button>
<label>고객 선택</label><select id="customerSelect"></select>
<button class="soft" onclick="makeCustomerReorderMsg()">선택 고객 재구매 안내</button>
<button class="blue" onclick="copyCustomerText()">고객관리 내용 복사</button>
<div id="customerResult" class="result">고객관리 결과가 여기에 표시됩니다.</div>
</div>

<button class="menuBtn" onclick="togglePanel('aiPanel')">AI 문구도우미 <span>›</span></button>
<div id="aiPanel" class="panel">
<h2>AI 문구도우미</h2>
<div class="quick">
<button class="soft" onclick="makeCustomerMsg('delivery')">택배 발송</button>
<button class="soft" onclick="makeCustomerMsg('delay')">배송 지연</button>
<button class="soft" onclick="makeCustomerMsg('thanks')">주문 감사</button>
<button class="soft" onclick="makeCustomerMsg('reorder')">재구매 안내</button>
<button class="soft" onclick="makeCustomerMsg('exp')">체험 확정</button>
<button class="soft" onclick="makeCustomerMsg('before')">체험 전날</button>
<button class="soft" onclick="makeCustomerMsg('rain')">우천 변경</button>
<button class="soft" onclick="makeCustomerMsg('soldout')">품절 안내</button>
</div>
<button class="green" onclick="makePlan()">작업 체크리스트</button>
<button class="soft" onclick="makePest()">병해충 질문</button>
<button class="blue" onclick="copyAI()">AI 결과 복사</button>
<div id="aiResult" class="result">AI 결과가 여기에 표시됩니다.</div>
</div>

<button class="menuBtn" onclick="togglePanel('analysisPanel')">월별 요약 보기 <span>›</span></button>
<div id="analysisPanel" class="panel">
<h2>월별 매출·경영요약</h2>
<div class="grid2"><div><label>분석 월</label><input type="month" id="analysisMonth"></div><div><label>&nbsp;</label><button class="green" onclick="makeBusinessAnalysis()">요약 보기</button></div></div>
<div id="kpiArea" class="kpi"></div>
<div id="businessResult" class="result">월별 요약이 여기에 표시됩니다.</div>
</div>

<button class="menuBtn" onclick="togglePanel('backupPanel')">백업·복원 <span>›</span></button>
<div id="backupPanel" class="panel">
<h2>백업·복원</h2>
<button class="green" onclick="makeBackupText()">백업내용 만들기</button>
<label>백업내용 붙여넣기</label><textarea id="backupText"></textarea>
<button class="soft" onclick="restoreBackupText()">붙여넣은 백업내용 복원</button>
<div class="result" id="reportResult">백업내용은 메모장이나 카카오톡 나에게 보내기에 보관하세요.</div>
</div>
</div>

<script>
const S='aiFarmV6Records',R='aiFarmV6Reserve',P='aiFarmV6Profile';
let records=JSON.parse(localStorage.getItem(S)||'[]'),reservations=JSON.parse(localStorage.getItem(R)||'[]');
let today=new Date().toISOString().slice(0,10);recordDate.value=today;reserveDate.value=today;analysisMonth.value=today.slice(0,7);

function togglePanel(id){document.getElementById(id).classList.toggle('open')}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function saveAll(){localStorage.setItem(S,JSON.stringify(records));localStorage.setItem(R,JSON.stringify(reservations))}
function saveProfile(){localStorage.setItem(P,JSON.stringify({farmName:farmName.value,ownerName:ownerName.value,farmPhone:farmPhone.value,crop:crop.value,memo:memo.value}));alert('저장되었습니다.')}
function loadProfile(){let p=JSON.parse(localStorage.getItem(P)||'null');if(p){farmName.value=p.farmName||'';ownerName.value=p.ownerName||'';farmPhone.value=p.farmPhone||'';crop.value=p.crop||'딸기';memo.value=p.memo||''}}
function info(){return{farm:farmName.value||'우리 농장',crop:crop.value,memo:memo.value}}
function render(){renderRecords();renderReservations();updateCustomerSelect()}
function saveRecord(){if(!recordContent.value.trim()){alert('내용을 입력하세요.');return}records.push({date:recordDate.value,type:recordType.value,content:recordContent.value,price:recordPrice.value});recordContent.value='';recordPrice.value='';saveAll();render()}
function renderRecords(){recordList.innerHTML='';records.slice().reverse().forEach(r=>{let d=document.createElement('div');d.className='record';d.innerHTML='<b>'+r.date+' / '+r.type+'</b><br>'+esc(r.content)+(r.price?'<br>'+Number(r.price).toLocaleString()+'원':'');recordList.appendChild(d)})}
function getRes(){return{reserveType:reserveType.value,reserveDate:reserveDate.value,customerName:customerName.value,customerPhone:customerPhone.value,reserveItem:reserveItem.value,reserveQty:reserveQty.value,reservePrice:reservePrice.value,reserveStatus:reserveStatus.value}}
function setRes(r){reserveType.value=r.reserveType||'직거래 주문';reserveDate.value=r.reserveDate||today;customerName.value=r.customerName||'';customerPhone.value=r.customerPhone||'';reserveItem.value=r.reserveItem||'';reserveQty.value=r.reserveQty||'';reservePrice.value=r.reservePrice||'';reserveStatus.value=r.reserveStatus||'접수'}
function saveReservation(){if(!customerName.value.trim()){alert('고객명을 입력하세요.');return}let idx=editReserveIndex.value;if(idx!=='')reservations[Number(idx)]=getRes();else reservations.push(getRes());editReserveIndex.value='';setRes({});saveAll();render()}
function editReservation(i){editReserveIndex.value=i;setRes(reservations[i]);document.getElementById('reservePanel').classList.add('open')}
function deleteReservation(i){if(confirm('삭제할까요?')){reservations.splice(i,1);saveAll();render()}}
function completeReservation(i){reservations[i].reserveStatus='완료';saveAll();render()}
function renderReservations(){reserveList.innerHTML='';reservations.slice().reverse().forEach((r,ri)=>{let i=reservations.length-1-ri,d=document.createElement('div');d.className='record';d.innerHTML='<b>'+r.reserveDate+' / '+r.reserveType+' / '+r.reserveStatus+'</b><br>'+esc(r.customerName)+' / '+esc(r.reserveItem)+'<br>수량: '+esc(r.reserveQty)+(r.reservePrice?'<br>'+Number(r.reservePrice).toLocaleString()+'원':'')+'<div class="actionRow"><button class="soft" onclick="editReservation('+i+')">수정</button><button class="soft" onclick="completeReservation('+i+')">완료</button><button class="red" onclick="deleteReservation('+i+')">삭제</button></div>';reserveList.appendChild(d)})}
function setAI(t){aiResult.innerText=t}
function makePlan(){setAI('['+crop.value+' 작업 체크리스트]\n\n☐ 병해충 예찰\n☐ 관수상태 확인\n☐ 생육상태 기록\n☐ 판매·출하 물량 확인\n☐ 고객 예약 확인')}
function makePest(){setAI('첨부한 '+crop.value+' 사진을 보고 병해충 또는 생육 이상 여부를 분석해줘.\n\n특이사항: '+(memo.value||'없음')+'\n\n1. 의심 증상\n2. 원인 가능성\n3. 관리방향')}
function makeCustomerMsg(t){let x=info(),m='';if(t==='delivery')m='[택배 발송 안내]\n\n안녕하세요. '+x.farm+'입니다. 주문하신 '+x.crop+'를 오늘 발송했습니다. 감사합니다.';if(t==='delay')m='[배송 지연 안내]\n\n안녕하세요. '+x.farm+'입니다. 배송이 다소 지연될 수 있어 안내드립니다. 양해 부탁드립니다.';if(t==='thanks')m='[주문 감사 문자]\n\n안녕하세요. '+x.farm+'입니다. 주문해주셔서 감사합니다.';if(t==='reorder')m='[재구매 안내 문자]\n\n안녕하세요. '+x.farm+'입니다. 이번 주에도 신선한 '+x.crop+' 준비 중입니다.';if(t==='exp')m='[체험예약 확정 안내]\n\n안녕하세요. '+x.farm+'입니다. 체험 예약이 확정되었습니다.';if(t==='before')m='[체험 전날 안내]\n\n안녕하세요. '+x.farm+'입니다. 내일 체험 방문 예정입니다. 편한 복장으로 방문해 주세요.';if(t==='rain')m='[우천 일정변경 안내]\n\n비 예보로 체험 일정 조정이 필요합니다. 가능한 일정을 다시 안내드리겠습니다.';if(t==='soldout')m='[품절 안내]\n\n준비된 물량이 모두 소진되었습니다. 다음 출하 일정에 다시 안내드리겠습니다.';setAI(m)}
function makeReserveMsg(){setAI('[예약 안내 문자]\n\n'+(customerName.value||'고객')+'님 안녕하세요.\n'+reserveDate.value+' '+reserveType.value+'이 접수되었습니다.\n예약 내용: '+reserveItem.value+' / '+reserveQty.value+'\n감사합니다.')}
function copyAI(){navigator.clipboard?.writeText(aiResult.innerText);alert('복사되었습니다.')}
function makeDiarySentence(){setAI('['+recordDate.value+' 영농일지 문장]\n\n'+recordDate.value+' '+crop.value+' 재배포장에서 '+(recordContent.value||'영농작업')+'을 실시함.')}
function customerStats(){let map={};reservations.forEach(r=>{let n=r.customerName||'미입력';if(!map[n])map[n]={name:n,count:0,total:0,last:'',items:[]};map[n].count++;map[n].total+=Number(r.reservePrice||0);if(!map[n].last||r.reserveDate>map[n].last)map[n].last=r.reserveDate;if(r.reserveItem)map[n].items.push(r.reserveItem)});return Object.values(map).sort((a,b)=>b.total-a.total)}
function updateCustomerSelect(){customerSelect.innerHTML='';customerStats().forEach(c=>{let o=document.createElement('option');o.value=c.name;o.textContent=c.name+' ('+c.count+'회)';customerSelect.appendChild(o)})}
function makeCustomerSummary(){let arr=customerStats();if(!arr.length){customerResult.innerText='저장된 고객 정보가 없습니다.';return}customerResult.innerText='[고객관리 요약]\n\n'+arr.map(c=>'- '+c.name+' / 구매·예약 '+c.count+'회 / 누적 '+c.total.toLocaleString()+'원 / 최근 '+c.last).join('\n')}
function makeCustomerReorderMsg(){let c=customerStats().find(x=>x.name===customerSelect.value);if(!c){customerResult.innerText='선택할 고객이 없습니다.';return}let x=info(),item=c.items[c.items.length-1]||x.crop;customerResult.innerText='[고객별 재구매 안내]\n\n'+c.name+'님 안녕하세요. '+x.farm+'입니다.\n지난번 '+item+' 주문해주셔서 감사합니다.\n이번 주에도 신선한 '+x.crop+' 준비 중입니다.'}
function copyCustomerText(){navigator.clipboard?.writeText(customerResult.innerText);alert('복사되었습니다.')}
function makeBusinessAnalysis(){let ym=analysisMonth.value,mr=records.filter(r=>r.date&&r.date.startsWith(ym)),ms=reservations.filter(r=>r.reserveDate&&r.reserveDate.startsWith(ym));let sale=mr.filter(r=>r.type==='판매').reduce((s,r)=>s+Number(r.price||0),0),cost=mr.filter(r=>r.type==='농자재').reduce((s,r)=>s+Number(r.price||0),0),reserve=ms.reduce((s,r)=>s+Number(r.reservePrice||0),0);kpiArea.innerHTML='<div>판매기록<strong>'+sale.toLocaleString()+'원</strong></div><div>예약·주문<strong>'+reserve.toLocaleString()+'원</strong></div><div>지출<strong>'+cost.toLocaleString()+'원</strong></div>';businessResult.innerText='['+ym+' 월별 매출·경영요약]\n\n- 판매기록 금액: '+sale.toLocaleString()+'원\n- 예약·주문 예정금액: '+reserve.toLocaleString()+'원\n- 농자재 지출: '+cost.toLocaleString()+'원\n- 단순 차액: '+(sale-cost).toLocaleString()+'원'}
function makeBackupText(){let data={profile:JSON.parse(localStorage.getItem(P)||'{}'),records,reservations,backupDate:new Date().toISOString()};backupText.value=JSON.stringify(data,null,2);navigator.clipboard?.writeText(backupText.value);alert('백업내용이 생성되고 복사되었습니다.')}
function restoreBackupText(){try{let d=JSON.parse(backupText.value);if(d.profile)localStorage.setItem(P,JSON.stringify(d.profile));records=d.records||[];reservations=d.reservations||[];saveAll();loadProfile();render();alert('복원되었습니다.')}catch(e){alert('백업내용 형식이 올바르지 않습니다.')}}
function loadSample(){farmName.value='청년딸기농장';ownerName.value='김농부';farmPhone.value='010-0000-0000';memo.value='직거래 고객관리와 판매기록 관리가 필요함';records=[{date:'2026-05-24',type:'작업일지',content:'유인작업',price:''},{date:'2026-05-25',type:'농자재',content:'포장박스 구입',price:'55000'},{date:'2026-05-27',type:'판매',content:'로컬푸드 출하',price:'420000'}];reservations=[{reserveType:'택배 주문',reserveDate:'2026-05-28',customerName:'김민지',customerPhone:'010-0000-0000',reserveItem:'딸기 2kg',reserveQty:'2박스',reservePrice:'60000',reserveStatus:'입금대기'},{reserveType:'체험 예약',reserveDate:'2026-05-30',customerName:'박서준',customerPhone:'010-1111-1111',reserveItem:'딸기체험',reserveQty:'4명',reservePrice:'80000',reserveStatus:'방문예정'}];saveAll();render()}
loadProfile();render();
</script>
